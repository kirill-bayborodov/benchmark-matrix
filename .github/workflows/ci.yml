name: Benchmark Core CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download vendor libraries dist artifacts
        env:
          # Используем токен для доступа к API (в т.ч. для приватных репозиториев, если токен имеет права)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          # Проходим по всем папкам внутри libs/
          for dir in libs/*/; do
            # Убираем слеш на конце для удобства
            dir=${dir%/}
            libname=$(basename "$dir")
            
            # Проверяем, что это вендорная библиотека (нет Makefile, src, include)
            if [ -d "$dir" ] && [ ! -f "$dir/Makefile" ] && [ ! -d "$dir/src" ] && [ ! -d "$dir/include" ]; then
              echo "========================================"
              echo "🔄 Processing vendor library: $libname"
              
              REPO="${{ github.repository_owner }}/$libname"
              BRANCH="main"
              
              # 1️⃣ Последний успешный run в выбранной ветке
              RUN_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/${REPO}/actions/runs?branch=${BRANCH}&status=success&per_page=1" | \
                jq -r '.workflow_runs[0].id'  )
                
              if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
                echo "❌ Не удалось получить RUN_ID для $REPO"
                exit 1
              fi

              # 2️⃣ URL артефакта с именем dist
              ARTIFACT_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts" | \
                jq -r '.artifacts[] | select(.name=="dist"  ) | .archive_download_url')
                
              if [[ -z "$ARTIFACT_URL" || "$ARTIFACT_URL" == "null" ]]; then
                echo "❌ Не найден артефакт dist для $REPO"
                exit 1
              fi

              # 3️⃣ Скачиваем и распаковываем прямо в libs/$libname/dist
              curl -L -H "Authorization: token $GITHUB_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   -o dist.zip "$ARTIFACT_URL"
                   
              mkdir -p "$dir/dist"
              unzip -o -q dist.zip -d "$dir/dist"
              rm dist.zip
              echo "✅ $libname артефакт помещён в $dir/dist"
            fi
          done


      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cppcheck valgrind

      - name: Build static library
        run: make all

      - name: Run static analysis
        run: make lint

      - name: Run deterministic ST and MT tests
        run: make test

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test_sanitize

      - name: Run Helgrind
        run: make clean && make test_helgrind

      - name: Create distribution
        run: make dist

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Pack distribution
        id: dist
        run: |
          ARCHIVE="benchmark-core-${{ github.ref_name }}.tar.gz"
          tar -C dist -czf "$ARCHIVE" .
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Create release and upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "benchmark-core release ${{ github.ref_name }}" \
            "${{ steps.dist.outputs.archive }}"
